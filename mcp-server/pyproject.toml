[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "litera-mcp-server"
version = "1.0.0"
description = "Model Context Protocol (MCP) Server for Litera Bookstore"
authors = [
    {name = "Kirill Zaidal", email = "zaidal@litera.by"},
    {name = "Anna-Maria Savitskaya", email = "savitskaya@litera.by"}
]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "mcp>=1.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
]

[project.scripts]
litera-mcp = "server:main"

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]
